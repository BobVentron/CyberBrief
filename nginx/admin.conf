##
## nginx/admin.conf — Container admin séparé
## Le ADMIN_API_TOKEN est injecté dans admin.html via sub_filter
## L'API reçoit le token depuis le JavaScript de la page
##

server {
    listen 80;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;

    add_header X-Content-Type-Options  "nosniff"       always;
    add_header X-Frame-Options         "DENY"          always;
    add_header X-Robots-Tag            "noindex"       always;
    add_header Cache-Control           "no-store"      always;

    # Injecte le token dans admin.html via sub_filter
    sub_filter '__ADMIN_TOKEN__' '$ADMIN_API_TOKEN';
    sub_filter_once on;

    location = / {
        try_files /admin.html =404;
    }

    location = /admin.html {
        add_header Cache-Control "no-store, no-cache" always;
    }

    location /api/ {
        proxy_pass         http://cyberbrief-api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location ~ /\. { deny all; return 404; }

    access_log /var/log/nginx/admin.access.log;
    error_log  /var/log/nginx/admin.error.log warn;
}
