server {
    listen 80;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # ── Sécurité globale ──────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"          always;
    add_header X-Frame-Options         "DENY"             always;
    add_header X-XSS-Protection        "1; mode=block"    always;
    add_header Referrer-Policy         "strict-origin"    always;
    add_header Permissions-Policy      "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none';"
        always;

    # ── Pages frontend ─────────────────────────────────────────────────────
    location = / {
        try_files /index.html =404;
    }

    location = /login {
        try_files /pages/login.html =404;
        add_header Cache-Control "no-store, no-cache" always;
    }

    location = /register {
        try_files /pages/register.html =404;
        add_header Cache-Control "no-store, no-cache" always;
    }

    location = /dashboard {
        try_files /pages/dashboard.html =404;
        add_header Cache-Control "no-store, no-cache" always;
    }

    location = /verify-email {
        try_files /pages/verify-email.html =404;
    }

    location = /forgot-password {
        try_files /pages/forgot-password.html =404;
    }

    location = /reset-password {
        try_files /pages/reset-password.html =404;
    }

    location = /privacy {
        try_files /pages/privacy.html =404;
    }

    # ── API proxy → FastAPI ────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://cyberbrief-api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # Rate limiting sur les routes sensibles
        limit_req zone=auth burst=10 nodelay;
    }

    # Rate limiting renforcé sur auth
    location ~ ^/api/auth/(login|register|forgot-password) {
        proxy_pass         http://cyberbrief-api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        limit_req zone=auth_strict burst=5 nodelay;
    }

    # ── Rapports HTML ──────────────────────────────────────────────────────
    location /reports/ {
        alias /usr/share/nginx/html/reports/;
        add_header X-Content-Type-Options "nosniff" always;

        location ~* \.(html|json)$ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }
        location ~* [^/]\.[^/]+$ {
            return 403;
        }
    }

    location = /reports/manifest.json {
        alias /usr/share/nginx/html/reports/manifest.json;
        add_header Content-Type "application/json; charset=utf-8";
        expires 5m;
    }

    # ── Fichiers statiques ─────────────────────────────────────────────────
    location ~* \.html$ {
        expires 30m;
        add_header Cache-Control "public, must-revalidate";
    }

    # ── Sécurité ───────────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    location /js/ {
        alias /usr/share/nginx/html/js/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.ico { log_not_found off; access_log off; }

    # ── Logs ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/cyberbrief.access.log;
    error_log  /var/log/nginx/cyberbrief.error.log warn;
}

# ── Rate limiting zones (définis dans nginx.conf principal) ──────────────────
# limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
# limit_req_zone $binary_remote_addr zone=auth_strict:10m rate=3r/m;
