user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logs ────────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;     # Ne pas révéler la version nginx

    # ── Rate limiting ────────────────────────────────────────────────────
    # Zone pour les routes API générales
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    # Zone stricte pour login / register / forgot-password
    limit_req_zone $binary_remote_addr zone=auth_strict:10m rate=3r/m;
    # Réponse 429 sur dépassement
    limit_req_status 429;

    # ── Gzip ─────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/html;
    gzip_min_length 1000;

    include /etc/nginx/conf.d/*.conf;
}
