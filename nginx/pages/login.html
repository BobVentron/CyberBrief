<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2305060a'/%3E%3Ctext x='4' y='23' font-family='Georgia,serif' font-size='20' font-weight='700' fill='%23e4eaf2'%3EC%3C/text%3E%3Ctext x='15' y='23' font-family='Georgia,serif' font-size='20' font-weight='700' fill='%2300d4ff'%3EB%3C/text%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberBrief — Connexion</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    /*  Design System  */
    :root {
      --bg:#07080a; --surface:#0c0e12; --surface-2:#0f1218;
      --border:#1c2028; --border-h:#2a3f57;
      --accent:#00d4ff; --accent-dim:rgba(0,212,255,.1); --accent-glow:rgba(0,212,255,.22);
      --green:#22c55e; --red:#ff3d3d;
      --text:#8892a0; --text-mid:#b8c4d0; --text-bright:#eef2f7; --text-dim:#3d4a5c;
      --mono:'JetBrains Mono',monospace; --display:'Syne',sans-serif;
      --t:.18s ease;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-font-smoothing:antialiased}
    body{
      background:var(--bg);color:var(--text-mid);
      font-family:var(--mono);font-size:13px;
      min-height:100vh;display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      padding:24px;
    }

    /*  Background grid  */
    body::before {
      content:'';position:fixed;inset:0;
      background-image:
        linear-gradient(rgba(0,212,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,.025) 1px, transparent 1px);
      background-size:40px 40px;
      pointer-events:none;
    }

    /*  Corner decorators  */
    .corner {
      position:fixed;width:60px;height:60px;
      border-color:rgba(0,212,255,.15);border-style:solid;
    }
    .corner-tl{top:20px;left:20px;border-width:1px 0 0 1px}
    .corner-tr{top:20px;right:20px;border-width:1px 1px 0 0}
    .corner-bl{bottom:20px;left:20px;border-width:0 0 1px 1px}
    .corner-br{bottom:20px;right:20px;border-width:0 1px 1px 0}

    /*  Card  */
    .card {
      position:relative;z-index:1;
      width:100%;max-width:420px;
      background:var(--surface);
      border:1px solid var(--border);
    }

    .card-header {
      padding:32px 32px 28px;
      border-bottom:1px solid var(--border);
    }

    .logo {
      font-family:var(--display);font-size:24px;font-weight:800;
      color:var(--text-bright);letter-spacing:-0.5px;
      text-decoration:none;display:block;margin-bottom:4px;
    }
    .logo span{color:var(--accent)}

    .tagline {
      font-size:10px;color:var(--text-dim);
      letter-spacing:2.5px;text-transform:uppercase;
    }

    /*  Form  */
    .card-body { padding:28px 32px 32px; }

    .fields { display:flex;flex-direction:column;gap:18px; }

    .field { display:flex;flex-direction:column;gap:5px; }

    .field-label {
      font-size:10px;font-weight:600;
      letter-spacing:1.5px;text-transform:uppercase;
      color:var(--text-dim);
    }

    .input-wrap { position:relative; }

    input[type=email],input[type=password],input[type=text] {
      width:100%;background:var(--surface-2);
      border:1px solid var(--border);
      color:var(--text-bright);font-family:var(--mono);font-size:13px;
      padding:11px 14px;outline:none;
      transition:border-color var(--t),box-shadow var(--t);
      -webkit-appearance:none;
    }
    input:focus {
      border-color:var(--accent);
      box-shadow:0 0 0 2px var(--accent-dim);
    }
    input::placeholder{color:var(--text-dim)}
    input.error-field{border-color:var(--red)}

    .eye-btn {
      position:absolute;right:12px;top:50%;transform:translateY(-50%);
      background:none;border:none;cursor:pointer;
      color:var(--text-dim);padding:4px;
      transition:color var(--t);
    }
    .eye-btn:hover{color:var(--text-mid)}

    .field-error{
      font-size:11px;color:var(--red);
      display:none;margin-top:2px;
    }
    .field-error.visible{display:block}

    /*  Alert  */
    .alert {
      padding:11px 14px;font-size:12px;
      border-left:3px solid;display:none;
      line-height:1.5;margin-bottom:18px;
    }
    .alert.visible{display:block}
    .alert-error{border-color:var(--red);background:rgba(255,61,61,.06);color:#ff7070}
    .alert-success{border-color:var(--green);background:rgba(34,197,94,.06);color:#4ade80}

    /*  Row (remember me)  */
    .row-between {
      display:flex;align-items:center;
      justify-content:space-between;gap:12px;
    }

    .checkbox-label {
      display:flex;align-items:center;gap:8px;
      cursor:pointer;font-size:12px;color:var(--text);
      user-select:none;
    }
    .checkbox-label input[type=checkbox]{
      width:14px;height:14px;
      accent-color:var(--accent);cursor:pointer;
    }

    a.link{color:var(--accent);font-size:12px;transition:color var(--t)}
    a.link:hover{color:#22dfff}

    /*  Button  */
    .btn {
      width:100%;padding:13px;
      background:var(--accent);color:#07080a;
      font-family:var(--mono);font-size:12px;font-weight:700;
      letter-spacing:2px;text-transform:uppercase;
      border:none;cursor:pointer;
      transition:all var(--t);
      display:flex;align-items:center;justify-content:center;gap:8px;
    }
    .btn:hover{background:#22dfff;box-shadow:0 0 24px var(--accent-glow)}
    .btn:disabled{background:var(--border);color:var(--text-dim);cursor:not-allowed;box-shadow:none}
    .btn:active{transform:scale(.99)}

    .spinner{
      width:14px;height:14px;
      border:2px solid rgba(0,0,0,.2);
      border-top-color:#07080a;border-radius:50%;
      animation:spin .7s linear infinite;display:none;
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    /*  Footer  */
    .card-footer {
      padding:18px 32px;
      border-top:1px solid var(--border);
      text-align:center;
      font-size:12px;color:var(--text-dim);
    }

    /*  Scan line animation  */
    @keyframes scan {
      0%  { top: -2px; opacity: .6; }
      100%{ top: 100%; opacity: 0; }
    }
    .card::after {
      content:'';position:absolute;left:0;right:0;height:1px;
      background:linear-gradient(90deg,transparent,var(--accent),transparent);
      animation:scan 3.5s ease-in-out infinite;
      pointer-events:none;
    }
  </style>
</head>
<body>
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="card">
    <div class="card-header">
      <a href="/" class="logo">Cyber<span>Brief</span></a>
      <div class="tagline">Veille cyber · Connexion</div>
    </div>

    <div class="card-body">
      <div class="alert alert-error" id="alertError" role="alert"></div>
      <div class="alert alert-success" id="alertSuccess" role="alert"></div>

      <form id="loginForm" novalidate autocomplete="on">
        <div class="fields">

          <div class="field">
            <label class="field-label" for="email">Adresse email</label>
            <input type="email" id="email" name="email"
                   placeholder="analyst@domain.com"
                   autocomplete="email" required>
            <span class="field-error" id="emailErr"></span>
          </div>

          <div class="field">
            <label class="field-label" for="password">Mot de passe</label>
            <div class="input-wrap">
              <input type="password" id="password" name="password"
                     placeholder="••••••••••"
                     autocomplete="current-password" required>
              <button type="button" class="eye-btn" id="eyeBtn"
                      aria-label="Afficher le mot de passe">
                <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <span class="field-error" id="pwdErr"></span>
          </div>

          <div class="row-between">
            <label class="checkbox-label">
              <input type="checkbox" id="remember">
              <span>Se souvenir de moi</span>
            </label>
            <a href="/forgot-password" class="link">Mot de passe oublié ?</a>
          </div>

          <button type="submit" class="btn" id="submitBtn">
            <span class="spinner" id="spinner"></span>
            <span id="btnText">Se connecter →</span>
          </button>
        </div>
      </form>
    </div>

    <div class="card-footer">
      Pas encore de compte ?
      <a href="/register" class="link">Créer un compte</a>
    </div>
  </div>

  <script>
    // Toggle password visibility 
    const pwdInput = document.getElementById('password');
    const eyeBtn   = document.getElementById('eyeBtn');
    eyeBtn.addEventListener('click', () => {
      const show = pwdInput.type === 'password';
      pwdInput.type = show ? 'text' : 'password';
      eyeBtn.setAttribute('aria-label', show ? 'Masquer' : 'Afficher');
      document.getElementById('eyeIcon').innerHTML = show
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="2"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    });

    // Form 
    const form       = document.getElementById('loginForm');
    const submitBtn  = document.getElementById('submitBtn');
    const spinner    = document.getElementById('spinner');
    const btnText    = document.getElementById('btnText');
    const alertError = document.getElementById('alertError');
    const alertOK    = document.getElementById('alertSuccess');

    function setLoading(v) {
      submitBtn.disabled = v;
      spinner.style.display = v ? 'inline-block' : 'none';
      btnText.textContent = v ? 'Connexion…' : 'Se connecter →';
    }

    function showError(msg) {
      alertError.textContent = msg;
      alertError.classList.add('visible');
      alertOK.classList.remove('visible');
    }

    function clearAlerts() {
      alertError.classList.remove('visible');
      alertOK.classList.remove('visible');
    }

    // Pré-remplissage si déjà connecté
    const existing = localStorage.getItem('cb_refresh');
    if (existing) {
      // Tente un refresh silencieux
      (async () => {
        try {
          const r = await fetch('/api/auth/refresh', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ refresh_token: existing }),
          });
          if (r.ok) {
            const d = await r.json();
            sessionStorage.setItem('cb_access', d.access_token);
            localStorage.setItem('cb_refresh', d.refresh_token);
            window.location.href = '/dashboard';
          }
        } catch(_) {}
      })();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlerts();

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;

      if (!email || !password) { showError('Veuillez remplir tous les champs.'); return; }

      setLoading(true);
      try {
        const res = await fetch('/api/auth/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (!res.ok) {
          showError(data.detail || 'Identifiants incorrects.');
          setLoading(false);
          return;
        }

        // Stockage tokens
        sessionStorage.setItem('cb_access', data.access_token);
        if (remember) {
          localStorage.setItem('cb_refresh', data.refresh_token);
        } else {
          sessionStorage.setItem('cb_refresh', data.refresh_token);
        }

        window.location.href = '/dashboard';

      } catch (err) {
        showError('Erreur réseau. Veuillez réessayer.');
        setLoading(false);
      }
    });

    // Auto-focus
    document.getElementById('email').focus();
  </script>
</body>
</html>
