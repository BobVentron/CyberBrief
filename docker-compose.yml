##
## CyberBrief v2 — Docker Compose
## Stack : Node.js + Express + Prisma + PostgreSQL
##

networks:
  proxy:
    external: true
  cyberbrief-internal:
    name: cyberbrief-internal
    driver: bridge

volumes:
  pg_data:
    name: cyberbrief_pg_data

services:

  cyberbrief-db:
    image: postgres:16-alpine
    container_name: cyberbrief-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cyberbrief
      POSTGRES_USER: ${DB_USER:-cyberbrief}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - cyberbrief-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cyberbrief} -d cyberbrief"]
      interval: 10s
      timeout: 5s
      retries: 5

  cyberbrief-api:
    build: ./api
    container_name: cyberbrief-api
    restart: unless-stopped
    depends_on:
      cyberbrief-db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-cyberbrief}:${DB_PASSWORD}@cyberbrief-db:5432/cyberbrief
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_TLS=${SMTP_TLS:-starttls}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-CyberBrief}
      - REPORT_BASE_URL=${REPORT_BASE_URL:-http://localhost:8080}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8080}
      - REPORTS_DIR=/app/reports
      - ACCESS_TTL_MIN=${ACCESS_TTL_MIN:-15}
      - REFRESH_TTL_DAYS=${REFRESH_TTL_DAYS:-30}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:bastien@soleilhac.me}
      - NODE_ENV=production
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - ./reports:/app/reports:ro
      - ./logs/api:/app/logs
    networks:
      - cyberbrief-internal
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8000/api/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3

  cyberbrief-app:
    build:
      context: .
    container_name: cyberbrief-app
    restart: unless-stopped
    depends_on:
      cyberbrief-api:
        condition: service_healthy
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOTIFY_APP_TOKEN=${GOTIFY_APP_TOKEN}
      - GOTIFY_URL=${GOTIFY_URL}
      - REPORT_BASE_URL=${REPORT_BASE_URL:-http://localhost:8080}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - CYBERBRIEF_API_URL=http://cyberbrief-api:8000
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - ./reports:/app/reports
      - ./logs/app:/app/logs
    networks:
      - cyberbrief-internal

  cyberbrief-web:
    build:
      context: ./nginx
      dockerfile: Dockerfile.web
    container_name: cyberbrief-web
    restart: unless-stopped
    depends_on:
      - cyberbrief-api
    volumes:
      - ./reports:/usr/share/nginx/html/reports:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - cyberbrief-internal
    labels:
      - "dockhand.enable=true"

  cyberbrief-admin:
    build:
      context: ./nginx
      dockerfile: Dockerfile.admin
    container_name: cyberbrief-admin
    restart: unless-stopped
    depends_on:
      - cyberbrief-api
    environment:
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN}
    volumes:
      - ./logs/admin:/var/log/nginx
    networks:
      - cyberbrief-internal
    labels:
      - "dockhand.enable=true"
